<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Design Case</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/css/reset.css">
	<link rel="stylesheet" href="/css/detailed.css">
</head>
<body>
	<main>
		<!-- 首屏第一张图直接加载 -->
		<div class="image-wrapper lazy-container immediate-load-container"> 
			<img src="/images/ios/pos/1.webp" alt="" data-width="1920" data-height="1080" class="lazy-image">
		</div>
		<!-- 从第二张图开始用JS实现Lazy加载 -->
		<div class="image-wrapper lazy-container"> 
			<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="lazy-image"
				alt="" data-width="1920" data-height="1486"
				data-src="/images/ios/pos/2.webp">
		</div>
		
    </main>

	<script src="/js/lazy-load.js"></script>
</body>
</html>
