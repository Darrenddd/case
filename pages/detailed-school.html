<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>Design Case</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/css/reset.css">
	<link rel="stylesheet" href="/css/detailed-1header.css">
	<!-- 这个loadDetailedHeader.js要先执行，目的是为了刚进去就加载头部文件，体验好一些，也是因为这个js只是加载文件，不用判断其它资源，所以可以先加载 -->
	<script src="/js/load-detailed-1header.js"></script>
</head>
<body>
	<!-- 这里用JS加载文件到这个<header>标签 -->
	<header></header>
	<main>
		<img src="/images/promotion/school/1.jfif" alt="">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/2.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/3.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/4.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/5.jfif" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/6.jfif" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/7.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/8.jfif" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/9.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/10.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/11.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/12.webp" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/13.jfif" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/14.jfif" alt="" class="lazy">
		<img src="/images/placeholder.png" data-src="/images/promotion/school/15.webp" alt="" class="lazy">
    </main>
	<!-- ---- JS ---- -->
	<!-- 要保证资源加载完才能再加载并执行js文件，要不然没有资源的话js代码无法判断 -->
	<script src="/js/load-json.js"></script>
	<script src="/js/lazy-load.js"></script>
</body>
</html>
